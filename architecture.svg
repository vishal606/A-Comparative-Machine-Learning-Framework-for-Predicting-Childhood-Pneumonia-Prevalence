<svg width="680" height="980" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .arr { stroke:#888; stroke-width:1.4; fill:none; }
    .th  { font-size:14px; font-weight:600; fill:#1a1a2e; }
    .ts  { font-size:12px; font-weight:400; fill:#444; }
    .label-w { fill:#0c447c; }
    .label-p { fill:#3c3489; }
    .label-g { fill:#3b6d11; }
    .label-a { fill:#854f0b; }
    .label-t { fill:#0f6e56; }
    .label-c { fill:#993c1d; }
  </style>
</defs>

<!-- background -->
<rect width="680" height="980" fill="#ffffff"/>

<!-- ══ STAGE 1: Raw data ═══════════════════════════════════════════════════ -->
<rect x="215" y="20" width="250" height="52" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="340" y="41" text-anchor="middle" dominant-baseline="central">Raw dataset</text>
<text class="ts" x="340" y="59" text-anchor="middle" dominant-baseline="central">BD_IRA.xlsx — 801 pediatric patients</text>

<!-- arrow -->
<line x1="340" y1="72" x2="340" y2="99" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 2: Feature engineering ═══════════════════════════════════════ -->
<rect x="60" y="100" width="560" height="130" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="0.8"/>
<text class="th label-w" x="340" y="122" text-anchor="middle" dominant-baseline="central">Feature engineering — 28 features</text>

<!-- Clinical -->
<rect x="80" y="138" width="118" height="78" rx="6" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#085041" x="139" y="157" text-anchor="middle" dominant-baseline="central">Clinical</text>
<text class="ts" fill="#0f6e56" x="139" y="173" text-anchor="middle" dominant-baseline="central">CRP, PCT, SaO2</text>
<text class="ts" fill="#0f6e56" x="139" y="188" text-anchor="middle" dominant-baseline="central">temp, RR, HR</text>
<text class="ts" fill="#0f6e56" x="139" y="203" text-anchor="middle" dominant-baseline="central">signs, X-ray</text>

<!-- Demographic -->
<rect x="212" y="138" width="116" height="78" rx="6" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#26215c" x="270" y="157" text-anchor="middle" dominant-baseline="central">Demographic</text>
<text class="ts" fill="#3c3489" x="270" y="173" text-anchor="middle" dominant-baseline="central">age, gender</text>
<text class="ts" fill="#3c3489" x="270" y="188" text-anchor="middle" dominant-baseline="central">siblings</text>
<text class="ts" fill="#3c3489" x="270" y="203" text-anchor="middle" dominant-baseline="central">prematurity</text>

<!-- Socio-env -->
<rect x="342" y="138" width="136" height="78" rx="6" fill="#eaf3de" stroke="#639922" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#173404" x="410" y="157" text-anchor="middle" dominant-baseline="central">Socio-environ.</text>
<text class="ts" fill="#3b6d11" x="410" y="173" text-anchor="middle" dominant-baseline="central">household size</text>
<text class="ts" fill="#3b6d11" x="410" y="188" text-anchor="middle" dominant-baseline="central">persons/room</text>
<text class="ts" fill="#3b6d11" x="410" y="203" text-anchor="middle" dominant-baseline="central">smoking, vit A</text>

<!-- Vaccination -->
<rect x="492" y="138" width="112" height="78" rx="6" fill="#faeeda" stroke="#ba7517" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#412402" x="548" y="157" text-anchor="middle" dominant-baseline="central">Vaccination</text>
<text class="ts" fill="#854f0b" x="548" y="173" text-anchor="middle" dominant-baseline="central">full / partial</text>
<text class="ts" fill="#854f0b" x="548" y="188" text-anchor="middle" dominant-baseline="central">none</text>
<text class="ts" fill="#854f0b" x="548" y="203" text-anchor="middle" dominant-baseline="central">Hib, PCV doses</text>

<!-- arrow -->
<line x1="340" y1="230" x2="340" y2="257" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 3: Target variable ═══════════════════════════════════════════ -->
<rect x="215" y="258" width="250" height="52" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="340" y="277" text-anchor="middle" dominant-baseline="central">Target variable</text>
<text class="ts" x="340" y="295" text-anchor="middle" dominant-baseline="central">Pneumonia=1 (27.3%) · Non-pneumonia=0</text>

<!-- arrow -->
<line x1="340" y1="310" x2="340" y2="337" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 4: Train/test split ══════════════════════════════════════════ -->
<rect x="215" y="338" width="250" height="52" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="340" y="357" text-anchor="middle" dominant-baseline="central">Stratified train/test split</text>
<text class="ts" x="340" y="375" text-anchor="middle" dominant-baseline="central">80% train (n=639) · 20% test (n=160)</text>

<!-- branch arrows -->
<path d="M280 390 L200 390 L200 419" class="arr" marker-end="url(#arrow)"/>
<path d="M400 390 L480 390 L480 419" class="arr" marker-end="url(#arrow)"/>

<!-- ══ Train pipeline ════════════════════════════════════════════════════ -->
<rect x="60" y="420" width="280" height="52" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="0.8"/>
<text class="th label-w" x="200" y="439" text-anchor="middle" dominant-baseline="central">Training pipeline</text>
<text class="ts" x="200" y="457" text-anchor="middle" dominant-baseline="central">StandardScaler (fit on train only)</text>

<!-- ══ Test set ══════════════════════════════════════════════════════════ -->
<rect x="360" y="420" width="260" height="52" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="490" y="439" text-anchor="middle" dominant-baseline="central">Test set (held-out)</text>
<text class="ts" x="490" y="457" text-anchor="middle" dominant-baseline="central">Scaler transform only — never fit</text>

<!-- arrow from train -->
<line x1="200" y1="472" x2="200" y2="499" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 5: SMOTE + CV ════════════════════════════════════════════════ -->
<rect x="60" y="500" width="280" height="64" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.8"/>
<text class="th label-c" x="200" y="520" text-anchor="middle" dominant-baseline="central">SMOTE + 5-fold stratified CV</text>
<text class="ts" fill="#993c1d" x="200" y="537" text-anchor="middle" dominant-baseline="central">Applied within each training fold only</text>
<text class="ts" fill="#993c1d" x="200" y="552" text-anchor="middle" dominant-baseline="central">Prevents data leakage from oversampling</text>

<!-- arrow -->
<line x1="200" y1="564" x2="200" y2="591" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 6: Hyperparameter tuning ════════════════════════════════════ -->
<rect x="60" y="592" width="280" height="64" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.8"/>
<text class="th label-p" x="200" y="612" text-anchor="middle" dominant-baseline="central">Hyperparameter tuning</text>
<text class="ts" fill="#534ab7" x="200" y="629" text-anchor="middle" dominant-baseline="central">RandomizedSearchCV (40 iterations)</text>
<text class="ts" fill="#534ab7" x="200" y="644" text-anchor="middle" dominant-baseline="central">XGBoost · LightGBM · Logistic Reg.</text>

<!-- arrow down to models -->
<line x1="200" y1="656" x2="200" y2="683" class="arr" marker-end="url(#arrow)"/>
<!-- connect test to models too -->
<path d="M490 472 L490 710 L620 710" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<!-- ══ STAGE 7: 11 Models ════════════════════════════════════════════════ -->
<rect x="60" y="684" width="560" height="110" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="0.8"/>
<text class="th label-w" x="340" y="706" text-anchor="middle" dominant-baseline="central">11 supervised classification algorithms</text>

<!-- Row 1 pills -->
<rect x="78"  y="720" width="116" height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="136" y="733" text-anchor="middle" dominant-baseline="central">Logistic Reg. ★</text>

<rect x="204" y="720" width="100" height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="254" y="733" text-anchor="middle" dominant-baseline="central">Decision Tree</text>

<rect x="314" y="720" width="110" height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="369" y="733" text-anchor="middle" dominant-baseline="central">Random Forest</text>

<rect x="434" y="720" width="130" height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="499" y="733" text-anchor="middle" dominant-baseline="central">Gradient Boosting</text>

<!-- Row 2 pills -->
<rect x="78"  y="758" width="96"  height="26" rx="13" fill="#faeeda" stroke="#ba7517" stroke-width="1.2"/>
<text font-size="11" font-weight="700" fill="#412402" x="126" y="771" text-anchor="middle" dominant-baseline="central">XGBoost ★</text>

<rect x="184" y="758" width="110" height="26" rx="13" fill="#faeeda" stroke="#ba7517" stroke-width="1.2"/>
<text font-size="11" font-weight="700" fill="#412402" x="239" y="771" text-anchor="middle" dominant-baseline="central">LightGBM ★</text>

<rect x="304" y="758" width="84"  height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="346" y="771" text-anchor="middle" dominant-baseline="central">AdaBoost</text>

<rect x="398" y="758" width="76"  height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="436" y="771" text-anchor="middle" dominant-baseline="central">SVM RBF</text>

<rect x="484" y="758" width="50"  height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="509" y="771" text-anchor="middle" dominant-baseline="central">KNN</text>

<rect x="544" y="758" width="64"  height="26" rx="13" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.7"/>
<text font-size="11" font-weight="600" fill="#085041" x="576" y="771" text-anchor="middle" dominant-baseline="central">NB · MLP</text>

<!-- arrow to evaluation -->
<line x1="340" y1="794" x2="340" y2="821" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 8: Evaluation ════════════════════════════════════════════════ -->
<rect x="60" y="822" width="560" height="64" rx="10" fill="#eaf3de" stroke="#639922" stroke-width="0.8"/>
<text class="th label-g" x="340" y="843" text-anchor="middle" dominant-baseline="central">Evaluation — test set + CV</text>
<text class="ts" fill="#3b6d11" x="340" y="860" text-anchor="middle" dominant-baseline="central">Accuracy · Precision · Recall · F1 · AUC-ROC</text>
<text class="ts" fill="#3b6d11" x="340" y="875" text-anchor="middle" dominant-baseline="central">CV-AUC mean ± 95% CI across 5 folds</text>

<!-- arrows to 3 outputs -->
<path d="M280 886 L174 886 L174 913" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="886" x2="340" y2="913" class="arr" marker-end="url(#arrow)"/>
<path d="M400 886 L506 886 L506 913" class="arr" marker-end="url(#arrow)"/>

<!-- ══ STAGE 9: Outputs ═══════════════════════════════════════════════════ -->
<!-- RF importance -->
<rect x="60"  y="914" width="228" height="32" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#26215c" x="174" y="930" text-anchor="middle" dominant-baseline="central">RF feature importance</text>

<!-- SHAP -->
<rect x="256" y="914" width="168" height="32" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#4a1b0c" x="340" y="930" text-anchor="middle" dominant-baseline="central">SHAP (XGBoost)</text>

<!-- Stats -->
<rect x="392" y="914" width="228" height="32" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.8"/>
<text font-size="13" font-weight="600" fill="#04342c" x="506" y="930" text-anchor="middle" dominant-baseline="central">Statistical tests (U / χ²)</text>

<!-- ══ Legend ═════════════════════════════════════════════════════════════ -->
<line x1="60" y1="962" x2="620" y2="962" stroke="#ccc" stroke-width="0.8"/>
<text class="ts" x="60" y="975" dominant-baseline="central">★ = hyperparameter tuned</text>
<rect x="194" y="969" width="13" height="12" rx="3" fill="#faeeda" stroke="#ba7517" stroke-width="0.8"/>
<text class="ts" x="213" y="975" dominant-baseline="central">Tuned models</text>
<rect x="298" y="969" width="13" height="12" rx="3" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.8"/>
<text class="ts" x="317" y="975" dominant-baseline="central">Default models</text>
<rect x="406" y="969" width="13" height="12" rx="3" fill="#eaf3de" stroke="#639922" stroke-width="0.8"/>
<text class="ts" x="425" y="975" dominant-baseline="central">Best: RF CV-AUC = 0.887</text>
</svg>
